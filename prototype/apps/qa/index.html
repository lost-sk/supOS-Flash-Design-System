<body>
<div class="app" id="app">
 <aside class="sidebar" aria-label="会话导航">
  <div class="brand"><span class="hideable">知识问答智能体</span><button class="plain" id="collapse" aria-label="折叠侧栏"><img class="icon" src="assets/icon-edit-frame-close.svg" alt=""></button></div>
  <button class="nav active" id="new-chat"><img class="icon" src="assets/icon-edit-add-talk.svg" alt=""><span class="hideable">新对话</span></button>
  <button class="nav" id="search-chat"><img class="icon" src="assets/icon-edit-search.svg" alt=""><span class="hideable">搜索对话</span></button>
  <h2 class="history-title">对话历史</h2><div class="histories" id="histories"></div>
  <div class="settings"><button class="plain" id="settings"><span aria-hidden="true">⚙</span><span class="hideable">　设置</span></button></div>
 </aside>
 <main class="main" id="main">
  <section class="welcome" id="welcome"><div class="hero"><img class="banner" src="assets/knowledge-qa-banner-v2.png" alt="知识问答智能体"></div></section>
  <section class="messages" id="messages" aria-label="对话内容" aria-live="polite" hidden></section>
  <form class="composer" id="composer">
   <div class="file-note" id="file-note" hidden></div>
   <textarea id="prompt" aria-label="消息" placeholder="请输入您的问题，例如：帮我查找设备操作手册中的维护要求..." rows="2"></textarea>
   <div class="toolbar"><button type="button" id="attach" aria-label="添加附件" title="添加附件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true" style="display:block"><path d="M12 5v14M5 12h14"/></svg></button><button type="button" id="scope-trigger" class="scope-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="scope-panel" title="检索范围：全部知识库"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4M3 7h2M3 12h2M3 17h2"/></svg><span id="scope-label">全部知识库</span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="button" id="mode" title="切换模式" style="display:inline-flex;align-items:center;gap:5px"><img id="mode-icon" src="assets/zap.svg" width="16" height="16" alt=""><span id="mode-label">闪速</span></button><span class="spacer"></span><button type="button" class="model-trigger" id="model" aria-label="选择模型" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu"><span id="model-name">DeepSeek-V4-Flash</span><svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m6 4 4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button type="submit" class="send" id="send" aria-label="发送消息" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-7 7 7-7 7 7"/></svg></button></div>
   <input type="file" id="file" hidden>
  </form>
 </main>
</div>
<section id="scope-panel" class="scope-panel" role="dialog" aria-modal="false" aria-labelledby="scope-title" hidden>
 <div class="scope-header"><div class="scope-heading"><span id="scope-title">检索范围</span><button type="button" class="plain" id="scope-close" aria-label="关闭范围选择">×</button></div><div class="scope-search-wrap"><img src="assets/icon-edit-search.svg" width="14" height="14" alt=""><input id="scope-search" type="search" placeholder="搜索知识库" aria-label="搜索知识库" autocomplete="off"></div><div class="scope-tabs" role="tablist" aria-label="知识库筛选"><button type="button" id="scope-tab-all" role="tab" aria-controls="scope-list" aria-selected="true">全部 <span id="scope-total">12</span></button><button type="button" id="scope-tab-selected" role="tab" aria-controls="scope-list" aria-selected="false">已选 <span id="scope-selected-tab">12</span></button></div></div>
 <label class="scope-all"><input type="checkbox" id="scope-all" checked><span class="scope-all-copy"><span>全部知识库</span><small>自动检索你有权限访问的全部内容</small></span></label>
 <div class="scope-list" id="scope-list" role="tabpanel" aria-labelledby="scope-tab-all"></div>
 <footer class="scope-footer"><span class="scope-count" id="scope-count" aria-live="polite">已选 12 个</span><div class="scope-actions"><button type="button" id="scope-cancel">取消</button><button type="button" id="scope-confirm" class="primary">确定</button></div></footer>

 $('scope-list').setAttribute('aria-labelledby',scopeTab==='all'?'scope-tab-all':'scope-tab-selected');$('scope-list').replaceChildren();
 const visible=knowledgeBases.filter(k=>(scopeTab==='all'||ids.includes(k.id))&&k.name.toLocaleLowerCase().includes(query));
 visible.forEach(k=>{const row=document.createElement('label');row.className='scope-row';const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.checked=ids.includes(k.id);checkbox.setAttribute('aria-label',k.name);const name=document.createElement('span');name.textContent=k.name;name.title=k.name;checkbox.onchange=()=>{const selected=new Set(draftIds());checkbox.checked?selected.add(k.id):selected.delete(k.id);scopeDraft={all:selected.size===knowledgeBases.length,ids:[...selected]};renderScope()};row.append(checkbox,name);$('scope-list').append(row)});
 if(!visible.length){const empty=document.createElement('div');empty.className='scope-empty';empty.textContent=query?'没有找到匹配的知识库':'尚未选择知识库';$('scope-list').append(empty)}
}
function openScope(){closeModels();scopeDraft=cloneScope(activeScope());scopeTab='all';$('scope-search').value='';$('scope-panel').hidden=false;$('scope-trigger').setAttribute('aria-expanded','true');renderScope();positionScope();$('scope-search').focus()}
$('scope-trigger').onclick=()=>{$('scope-panel').hidden?openScope():closeScope(true)};
$('scope-search').oninput=()=>renderScope();
$('scope-all').onchange=()=>{scopeDraft={all:$('scope-all').checked,ids:[]};renderScope()};
['all','selected'].forEach(tab=>{$('scope-tab-'+tab).onclick=()=>{scopeTab=tab;renderScope();$('scope-list').scrollTop=0};$('scope-tab-'+tab).onkeydown=e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const next=tab==='all'?'selected':'all';$('scope-tab-'+next).click();$('scope-tab-'+next).focus()}}});
$('scope-confirm').onclick=()=>{if(!draftIds().length)return;const scope=cloneScope(scopeDraft);if(current)current.scope=scope;else welcomeScope=scope;updateScopeLabel();closeScope(true)};
$('scope-cancel').onclick=$('scope-close').onclick=()=>closeScope(true);
$('scope-panel').onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();closeScope(true)}};
document.addEventListener('click',e=>{if(!$('scope-panel').hidden&&!$('scope-panel').contains(e.target)&&!$('scope-trigger').contains(e.target))closeScope()});
document.addEventListener('focusin',e=>{if(!$('scope-panel').hidden&&!$('scope-panel').contains(e.target)&&!$('scope-trigger').contains(e.target))closeScope()});
window.addEventListener('resize',()=>closeScope());$('main').addEventListener('scroll',()=>closeScope());
render();

</script>
</body>
</html>
