<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="APS 高级计划与排程系统 —— 需求、MRP 净算、齐套检查、有限产能排程与计划看板" />
  <title>APS 高级计划与排程系统</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/pro.css" />
</head>
<body>
  <a class="skip-link" href="#content">跳到主内容</a>

  <header class="topbar">
    <button class="pro-menu-toggle" id="proMenuToggle" type="button" aria-label="展开或收起模块树" aria-expanded="true">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--p-brand-bg)"/>
          <path d="M7 21.5L12.5 11l4.6 7.2L20.4 13l4.6 8.5" fill="none" stroke="var(--p-brand-fg)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12.5" cy="11" r="2" fill="var(--p-brand-fg)"/>
          <circle cx="25" cy="21.5" r="2" fill="var(--p-brand-fg)"/>
        </svg>
      </span>
      <div class="brand-text">
        <div class="title">APS 高级计划与排程</div>
        <div class="subtitle">Advanced Planning &amp; Scheduling</div>
      </div>
      <span class="brand-ver" id="proVer" title="应用版本">v2.2.0</span>
    </div>

    <nav class="topnav" id="topnav" aria-label="主导航"><!-- 由 app.js 动态渲染 --></nav>

    <div class="topright">
      <span class="env-chip" id="apsEnv" title="当前运行环境">环境识别中</span>
      <button id="proCmd" class="icon-btn" type="button" title="命令面板 · Ctrl/⌘ + K" aria-label="打开命令面板">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12.6 12.6l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span class="cmd-label">搜索</span><kbd>⌘K</kbd>
      </button>
      <button id="proTheme" class="icon-btn" type="button" title="切换深浅主题" aria-label="切换深浅主题">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M16.2 12.4A6.8 6.8 0 017.6 3.8a6.8 6.8 0 108.6 8.6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      </button>
      <button id="proDensity" class="icon-btn" type="button" title="切换表格密度" aria-label="切换表格密度">
        <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="btnSettings" class="ghost" title="选择顶部导航显示哪些视图">显示设置</button>
      <button id="btnReset" class="ghost" title="恢复内置演示数据">重置演示数据</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar" aria-label="模块树"><!-- 由 app.js 动态渲染 --></aside>
    <main class="content" id="content" tabindex="-1"><!-- 由 app.js 动态渲染 --></main>
  </div>

  <div class="modal-mask" id="modalMask" style="display:none">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-head"><span id="modalTitle">编辑</span><button id="modalClose" aria-label="关闭">✕</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot"><button id="modalCancel" class="ghost">取消</button><button id="modalSave" class="primary">保存</button></div>
    </div>
  </div>

  <div id="toast" class="toast" style="display:none" role="status" aria-live="polite"></div>

  <script src="js/qrcode.js"></script>
  <script src="js/schema.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pro.js"></script>
</body>
</html>
