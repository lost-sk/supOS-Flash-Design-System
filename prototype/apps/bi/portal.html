<style>
*{box-sizing:border-box}body{margin:0;color:#23344d;background:#f2f4f8;font:13px "Microsoft YaHei","PingFang SC",Arial,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid #91b7ff;outline-offset:2px}[hidden]{display:none!important}.topbar{height:46px;background:linear-gradient(105deg,#285cc9,#3b78ed);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 14px}.logo{font:700 24px Arial,sans-serif;letter-spacing:-1.2px}.logo span{font-size:23px;margin-left:6px;color:transparent;-webkit-text-stroke:1px white;font-style:italic}.top-actions{display:flex;align-items:center;gap:17px}.top-actions button{color:#fff;border:0;background:transparent;display:flex;align-items:center;gap:5px;padding:0}.divider{height:20px;border-left:1px solid #ffffff38}.avatar{width:27px;height:27px;border-radius:50%;background:#e9f3ff;position:relative;overflow:hidden}.avatar:before{content:'';position:absolute;width:9px;height:9px;border-radius:50%;background:#bfd3ed;top:5px;left:9px}.avatar:after{content:'';position:absolute;width:19px;height:14px;border-radius:50% 50% 0 0;background:#bfd3ed;bottom:-1px;left:4px}.workspace{height:calc(100dvh - 46px);display:flex}.sidebar{position:relative;width:244px;flex-shrink:0;background:#fff;border-right:1px solid #e7eaf0;box-shadow:2px 0 8px #12375805;display:flex;flex-direction:column}.menu-search{display:flex;gap:8px;padding:9px 12px 8px 6px}.search-box{display:flex;align-items:center;gap:6px;flex:1;min-width:0;border:1px solid #dce4ef;border-radius:4px;padding:7px 9px}.search-box input{border:0;outline:none;width:100%;min-width:0;font-size:12px;color:#344054}.search-box input::placeholder{color:#b3bac5}.menu-tool{width:32px;border:1px solid #dce4ef;background:#fff;border-radius:4px}.favorites{padding:10px 13px 13px;color:#aaa;display:flex;align-items:center;gap:9px;font-size:12px}.favorites svg{color:#38424d}.menus{overflow-y:auto;flex:1;padding-bottom:40px;scrollbar-width:thin}.menu-group{padding:0 10px}.menu-group summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:39px;font-weight:600;color:#26374c;user-select:none}.menu-group summary::-webkit-details-marker{display:none}.app-icon{font-size:8px;font-family:Arial;background:#e1e3e5;color:#242d38;border-radius:4px;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}.menu-group summary .chevron{margin-left:auto;color:#8b9cb5;font-size:16px;transition:transform .15s}.menu-group[open] summary .chevron{transform:rotate(180deg)}.menu-group.knowledge summary{color:#1677ff}.menu-item{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:35px;padding:8px 12px 8px 29px;border:0;background:none;border-radius:3px;text-align:left;font-size:13px;line-height:1.5}.menu-item:hover{background:#f6f8fc}.menu-item.active{background:#edf3ff;color:#1677ff;box-shadow:inset 2px 0 #337bff}.subtree{margin-left:30px;padding-left:0;border-left:1px solid #dfe2e6}.subtree .menu-item{padding-left:18px;font-size:12px}.sub-title{color:#1677ff}.menu-item .chevron{font-size:16px;color:#91a0b9}.collapse{position:absolute;right:17px;bottom:18px;width:27px;height:27px;border-radius:50%;border:1px solid #e2e5eb;background:#fff;box-shadow:0 2px 5px #00000008;color:#7c8da6}.content{flex:1;min-width:0;display:flex;flex-direction:column}.tabs{height:36px;background:#edf0f5;border-bottom:1px solid #d9dde5;display:flex;align-items:end;padding:0 9px;gap:6px;flex-shrink:0}.tab{height:29px;min-width:150px;display:flex;align-items:center;justify-content:space-between;gap:20px;background:#fff;border-radius:4px 4px 0 0;padding:0 10px 0 12px;color:#1677ff;box-shadow:0 -1px 4px #00000002}.tab .tab-name{border:0;background:none;padding:0;color:inherit}.tab-close{border:0;background:none;color:#929aa6;font-size:16px;padding:0 2px}.tab-close:hover{color:#1677ff}.tab-spacer{flex:1}.fullscreen{height:32px;width:32px;border:0;background:none;color:#58667a}.frame-wrap{flex:1;min-height:0;position:relative;background:#f3f5f9}.frame-wrap iframe{width:100%;height:100%;display:block;border:0;background:white}.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#8e9aad}.empty .empty-icon{font-size:36px;color:#bfd3f6}.empty h1{font-size:18px;font-weight:500;color:#344054;margin:0}.empty p{margin:0;font-size:13px}.empty button{border:0;border-radius:6px;color:white;background:#1677ff;padding:9px 18px;margin-top:6px}.collapsed .sidebar{width:54px}.collapsed .menu-search,.collapsed .favorites,.collapsed .menu-group summary span:not(.app-icon),.collapsed .menu-group .menu-item,.collapsed .subtree{display:none}.collapsed .menu-group{padding:5px 18px}.collapsed .collapse{right:13px}.no-results{padding:20px;color:#98a2b3;text-align:center;font-size:12px}.focus-view .sidebar,.focus-view .topbar{display:none}.focus-view .workspace{height:100dvh}.help-dialog{border:1px solid #e1e7ef;border-radius:10px;color:#344054;padding:24px;width:min(400px,90vw);box-shadow:0 16px 50px #18284030}.help-dialog::backdrop{background:#18284030}.help-dialog h2{font-size:17px;margin:0 0 14px}.help-dialog p{line-height:1.9;color:#667085}.help-dialog button{border:0;background:#1677ff;color:white;padding:6px 16px;border-radius:5px;float:right}@media(max-width:800px){.sidebar{width:206px}.top-actions{gap:10px}.menu-group summary{font-size:12px}.menu-item{font-size:12px}}@media(max-width:520px){.sidebar{width:170px}.menu-search{padding-right:6px}.menu-tool{display:none}.menu-group{padding:0 6px}.menu-group summary{gap:5px}.menu-item{padding-left:24px}.top-actions .optional{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="logo" aria-label="supOS X">supOS<span>X</span></div><div class="top-actions"><span class="optional" aria-hidden="true">☷</span><span class="divider optional"></span><button id="help"><span style="font-size:18px">ⓘ</span> 手册</button><span class="optional" aria-hidden="true">⚒</span><div class="avatar" aria-label="用户头像"></div></div></header>
<div class="workspace">
 <aside class="sidebar" aria-label="平台导航">
  <div class="menu-search"><label class="search-box"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 6 6"/></svg><input id="menu-search" placeholder="输入 菜单名称 搜索" aria-label="搜索菜单"></label><button class="menu-tool" title="展开所有菜单" id="expand-all" aria-label="展开所有菜单">⊞</button></div>
  <div class="favorites"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21 3 12C-4 4 6-2 12 5 18-2 28 4 21 12Z"/></svg>收藏</div>
  <nav class="menus" aria-label="应用菜单">
   <details class="menu-group" open><summary><span class="app-icon">app</span><span>汽配车间 OpenClaw 验证</span><span class="chevron">⌃</span></summary><button class="menu-item" data-page="对话助手">对话助手</button></details>
   <details class="menu-group knowledge" open><summary><span class="app-icon">app</span><span>数智BI智能体</span><span class="chevron">⌃</span></summary><button class="menu-item active" id="knowledge-menu" data-page="数据问答" aria-current="page">数据问答</button></details>
   <details class="menu-group" open><summary><span class="app-icon">app</span><span>设备台账管理</span><span class="chevron">⌃</span></summary><button class="menu-item" data-page="设备台账">设备台账</button></details>
   <details class="menu-group" open><summary><span class="app-icon">app</span><span>MES回归测试</span><span class="chevron">⌃</span></summary><button class="menu-item" data-page="工厂建模">工厂建模<span class="chevron">›</span></button><div class="menu-item sub-title">工艺管理<span class="chevron">⌃</span></div><div class="subtree"><button class="menu-item" data-page="工艺路线主数据">工艺路线主数据</button><button class="menu-item" data-page="工艺路线工序序列">工艺路线工序序列</button><button class="menu-item" data-page="工序字典">工序字典</button><button class="menu-item" data-page="工序设备能力矩阵">工序设备能力矩阵</button><button class="menu-item" data-page="工艺版本">工艺版本</button><button class="menu-item" data-page="工艺版本记录">工艺版本记录</button><button class="menu-item" data-page="作业指导书">作业指导书</button><button class="menu-item" data-page="外协工序">外协工序</button></div><button class="menu-item" data-page="订单管理">订单管理<span class="chevron">›</span></button><button class="menu-item" data-page="计划排产">计划排产<span class="chevron">›</span></button><button class="menu-item" data-page="生产管理">生产管理<span class="chevron">›</span></button><button class="menu-item" data-page="库存管理">库存管理<span class="chevron">›</span></button><button class="menu-item" data-page="设备管理">设备管理<span class="chevron">›</span></button></details>
   <div class="no-results" id="no-results" hidden>没有匹配的菜单</div>
  </nav><button class="collapse" id="collapse-platform" aria-label="折叠平台菜单" title="折叠平台菜单">«</button>
 </aside>
 <main class="content"><div class="tabs"><div class="tab" id="active-tab"><button class="tab-name" id="tab-name">数据问答</button><button class="tab-close" id="close-tab" aria-label="关闭当前页签">×</button></div><span class="tab-spacer"></span><button class="fullscreen" id="focus-view" aria-label="切换专注模式" title="切换专注模式">⛶</button></div><div class="frame-wrap"><iframe src="index.html" title="数智BI智能体" id="chat-frame"></iframe><section class="empty" id="placeholder" hidden><div class="empty-icon">▤</div><h1 id="placeholder-title">请选择菜单</h1><p id="placeholder-description">点击左侧“数据问答”打开智能体。</p><button id="open-knowledge">打开数据问答</button></section></div></main>
</div>
<dialog id="help-dialog" class="help-dialog"><h2>平台原型说明</h2><p>本页模拟 supOS 平台外层导航。点击“数智BI智能体 → 数据问答”，右侧加载同目录的聊天原型 index.html。</p><p>其他菜单为占位演示，未接入实际业务系统。</p><button id="close-help">知道了</button></dialog>
<script>
const el=id=>document.getElementById(id);
function openPage(name){document.querySelectorAll('[data-page]').forEach(b=>{const active=b.dataset.page===name;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});el('active-tab').hidden=false;el('tab-name').textContent=name;const knowledge=name==='数据问答';el('chat-frame').hidden=!knowledge;el('placeholder').hidden=knowledge;if(!knowledge){el('placeholder-title').textContent=name;el('placeholder-description').textContent='此菜单为平台导航占位，点击下方按钮体验数据问答。'}document.title='supOS X · '+name}
document.querySelectorAll('[data-page]').forEach(button=>button.onclick=()=>openPage(button.dataset.page));
el('open-knowledge').onclick=()=>{document.querySelector('.knowledge').open=true;el('menu-search').value='';filterMenus();openPage('数据问答')};
el('close-tab').onclick=()=>{el('active-tab').hidden=true;el('chat-frame').hidden=true;el('placeholder').hidden=false;el('placeholder-title').textContent='请选择菜单';el('placeholder-description').textContent='点击左侧“数据问答”打开智能体。';document.querySelectorAll('[data-page]').forEach(b=>{b.classList.remove('active');b.removeAttribute('aria-current')})};
function filterMenus(){const query=el('menu-search').value.trim().toLowerCase();let found=false;document.querySelectorAll('.menu-group').forEach(group=>{const groupMatch=group.querySelector('summary').textContent.toLowerCase().includes(query);let childMatch=false;group.querySelectorAll('[data-page]').forEach(button=>{const match=groupMatch||button.dataset.page.toLowerCase().includes(query);button.hidden=!match;if(match)childMatch=true});group.hidden=!groupMatch&&!childMatch;if(!group.hidden)found=true;if(query&&!group.hidden)group.open=true});el('no-results').hidden=found}
el('menu-search').oninput=filterMenus;
el('expand-all').onclick=()=>{document.querySelectorAll('.menu-group').forEach(group=>group.open=true)};
el('collapse-platform').onclick=()=>{const collapsed=document.body.classList.toggle('collapsed');el('collapse-platform').textContent=collapsed?'»':'«';el('collapse-platform').setAttribute('aria-label',collapsed?'展开平台菜单':'折叠平台菜单')};
el('focus-view').onclick=()=>document.body.classList.toggle('focus-view');document.addEventListener('keydown',event=>{if(event.key==='Escape')document.body.classList.remove('focus-view')});
el('help').onclick=()=>el('help-dialog').showModal();el('close-help').onclick=()=>el('help-dialog').close();
</script>
</body>
</html>
