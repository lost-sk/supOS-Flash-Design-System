function openChartConversation(){newChat();showDemo('请统计本季度各产线的报警次数，支持切换图表查看。',true);const article=$('messages').querySelector('article');article.querySelector('h2').textContent='本季度各产线报警统计';const thought=document.createElement('details');thought.className='processing-panel';thought.open=true;thought.innerHTML='<summary><div class="processing-head"><span class="processing-heading"><span style="color:#4386fa">✓</span> 思考过程 <span class="processing-badge">演示</span></span><span class="processing-actions">展开 / 收起</span></div></summary><div class="processing-subtitle">查询处理摘要 · 展示数据范围、口径核对与执行步骤</div><div class="processing-steps">'+[['识别查询范围','时间：2026 年第三季度；维度：产线；指标：报警次数。'],['匹配语义模型与口径','示例模型：报警记录、产线台账；按报警记录计次，使用 line_id 关联。'],['执行取数','按产线分组统计，并查询上季度总数作为对比。'],['整理查询结果','一号 240 次、二号 310 次、三号 540 次、四号 190 次，合计 1,280 次。']].map(x=>'<div class="processing-step done"><span class="processing-step-icon">✓</span><div class="processing-step-content"><div class="processing-step-label">'+x[0]+'</div><div class="processing-step-detail">'+x[1]+'</div></div></div>').join('')+'</div><div class="processing-status">查询完成 · 已生成表格与图表</div><div class="processing-footer">模拟处理摘要，未调用真实模型或查询服务</div>';article.insertBefore(thought,article.querySelector('h2'));const chart=article.querySelector('.chart');chart.previousElementSibling.remove();chart.remove();article.querySelector('details:not(.processing-panel)').remove();const viz=document.createElement('section');viz.className='data-viz';viz.innerHTML='<div class="viz-toolbar"><strong>各产线报警数量</strong><div class="viz-tabs" role="group" aria-label="切换图表类型">'+[['table','表格'],['bar','柱状图'],['line','折线图'],['pie','饼图']].map(x=>'<button data-viz-type="'+x[0]+'" onclick="switchVisualization(this,\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</div></div><div class="viz-body"></div>';article.querySelector('.result-meta').before(viz);switchVisualization(viz.querySelector('button'),'table');$('scroll').scrollTop=0}
function switchVisualization(button,type){const section=button.closest('.data-viz'),body=section.querySelector('.viz-body');section.querySelectorAll('.viz-tabs button').forEach(b=>{b.classList.toggle('active',b===button);b.setAttribute('aria-pressed',b===button)});const values=[240,310,540,190],names=['一号产线','二号产线','三号产线','四号产线'],colors=['#78aaff','#4d8df0','#2468da','#a6c8ff'];if(type==='table'){body.innerHTML='<table><thead><tr><th>产线</th><th>报警数量（次）</th><th>占比</th></tr></thead><tbody>'+values.map((v,i)=>'<tr><td>'+names[i]+'</td><td>'+v+'</td><td>'+(v/1280*100).toFixed(1)+'%</td></tr>').join('')+'</tbody></table>';return}if(type==='bar'){body.innerHTML='<div class="chart">'+values.map((v,i)=>'<div class="bar" style="height:'+v/6+'%;background:'+colors[i]+'"><span>'+v+'</span><em>'+names[i]+'</em></div>').join('')+'</div>';return}if(type==='line'){const points=values.map((v,i)=>(70+i*140)+','+(190-v/4));body.innerHTML='<svg viewBox="0 0 560 240" role="img" aria-label="各产线报警次数折线图"><path d="M45 30V190H530" fill="none" stroke="#dce4ef"/><polyline points="'+points.join(' ')+'" fill="none" stroke="#4d8df0" stroke-width="3"/>'+values.map((v,i)=>'<circle cx="'+(70+i*140)+'" cy="'+(190-v/4)+'" r="5" fill="#4d8df0"/><text x="'+(70+i*140)+'" y="'+(175-v/4)+'" text-anchor="middle" fill="#64738a" font-size="12">'+v+'</text><text x="'+(70+i*140)+'" y="220" text-anchor="middle" fill="#8793a5" font-size="12">'+names[i]+'</text>').join('')+'</svg>';return}let angle=-Math.PI/2;let paths='';values.forEach((v,i)=>{const next=angle+v/1280*2*Math.PI,x=200+85*Math.cos(angle),y=110+85*Math.sin(angle),ex=200+85*Math.cos(next),ey=110+85*Math.sin(next);paths+='<path d="M200 110 L'+x+' '+y+' A85 85 0 '+(v/1280>.5?1:0)+' 1 '+ex+' '+ey+' Z" fill="'+colors[i]+'" stroke="white" stroke-width="2"/><text x="'+(200+57*Math.cos((angle+next)/2))+'" y="'+(114+57*Math.sin((angle+next)/2))+'" fill="#fff" font-size="12" text-anchor="middle">'+(v/1280*100).toFixed(1)+'%</text>';angle=next});body.innerHTML='<svg viewBox="0 0 400 220" role="img" aria-label="各产线报警占比饼图">'+paths+'</svg><div class="viz-legend">'+names.map((n,i)=>'<span><span style="color:'+colors[i]+'">●</span> '+n+'</span>').join('')+'</div>'}
